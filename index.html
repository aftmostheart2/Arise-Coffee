<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1C0A00" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Arise! Coffee" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
  <script>
    const appParams = new URLSearchParams(window.location.search);
    if (window.location.pathname.toLowerCase().startsWith("/clergy") || appParams.get("mode") === "clergy") {
      document.getElementById("app-manifest")?.setAttribute("href", "/clergy-manifest.webmanifest");
      document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute("content", "Arise! Clergy");
    }
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Arise! Coffee</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
